# Tileset de Primitivo  —  cada letra de overworld.txt se define aca.
# Formato:   letra  kind  png  x  y  sz  flags...
#   kind:    floor | object | inn | fence | chest
#   png:     ruta relativa a assets/, o  -  si no usa textura (floor de color)
#   x y sz:  region en el png (px) en pasos de 16; usa  -  para textura completa
#   flags:   solid  encounter  autotile  draw=N  tint=RRGGBB  color=RRGGBB
#   autotile: la region (x,y) es la esquina sup-izq de un bloque 3x3 (orillas)
#
# Editas esto (o el txt) y el juego recarga en caliente. Para agregar un tile:
# sumas una linea con una letra nueva y la usas en overworld.txt.

# --- pisos (floor) ---
.  floor   tiles/overworld/Path_Tile.png   0 0 16   autotile
G  floor   tiles/overworld/grass.png    0  0 16
S  floor   tiles/overworld/plains.png   16 144 16
W  floor   tiles/overworld/Water_Tile.png  0 0 16   solid autotile

# --- objetos (object) — sprite sobre pasto ---
# tall grass: helecho caminable (sin 'solid') con encuentros
h  object  tiles/overworld/Fern1_1.png  - - -   encounter draw=32
H  object  tiles/overworld/Fern1_1.png  - - -   encounter draw=32
T  object  tiles/overworld/trees/Trees_shadow/Tree1.png       - - -  solid draw=128
M  object  tiles/overworld/trees/Trees_shadow/Moss_tree1.png  - - -  solid draw=128
P  object  tiles/overworld/trees/Trees_shadow/Fruit_tree1.png - - -  solid draw=128
r  object  tiles/overworld/rock.png    - - -   solid draw=32

# --- especiales ---
F  fence   tiles/overworld/fences.png   0 0 16   solid
I  inn     tiles/overworld/inn.png       - - -
C  chest   tiles/overworld/chest_01.png  0 0 16  solid
